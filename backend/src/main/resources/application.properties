# Server Configuration
server.port=${PORT:8080}

# MongoDB Configuration via Environment Variables
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/univgeeks}}
spring.data.mongodb.database=${MONGODB_DATABASE:univgeeks}

# Frontend / CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://univsvh.in,https://www.univsvh.in,http://localhost:3000,http://127.0.0.1:3000}

# Admin Bootstrap Credentials (configured via environment variables or .env)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}
admin.email=${ADMIN_EMAIL:admin@univgeeks.in}

# JWT Authentication
jwt.secret=${JWT_SECRET:UnivGeeksSecretKeyForJwtAuthenticationTokensMustBeAtLeast32BytesLong!}
jwt.expiration-hours=24

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Application Info
spring.application.name=univgeeks-backend

# ImageKit Cloud Storage Configuration
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/eguapakpx}
